name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Los builds de Windows y Linux corren en paralelo. electron-builder no
  # publica nada (no hay `--publish always`): primero creamos la release aquí
  # y cada job sube sus ficheros con `gh release upload --clobber`. Así no hay
  # carrera creando la release ni respuestas vacías que electron-builder no
  # sabe parsear.
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # gh necesita un repositorio Git para crear la release; sin checkout
      # falla con "fatal: not a git repository".
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear release si no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Publicando instaladores..." \
              --target "${{ github.sha }}"
          fi

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar nombre y notas de la release
        run: node scripts/release.mjs --prepare-notes "${{ github.ref_name }}"

      - name: Compilar .exe
        if: matrix.platform == 'win'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:ci

      - name: Compilar AppImage y .deb
        if: matrix.platform == 'linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:linux:ci

      - name: Subir instaladores de Windows
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-release-assets.mjs "${{ github.ref_name }}"

      - name: Subir instaladores de Linux
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-release-assets.mjs "${{ github.ref_name }}"

      # Fase 4: publicamos el SHA256 de cada instalador para poder verificar
      # la descarga (especialmente importante mientras el .exe no está firmado).
      - name: Publicar SHA256SUMS de Windows
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/checksums.mjs --platform win
          gh release upload "${{ github.ref_name }}" dist/SHA256SUMS-win.txt --clobber

      - name: Publicar SHA256SUMS de Linux
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/checksums.mjs --platform linux
          gh release upload "${{ github.ref_name }}" dist/SHA256SUMS-linux.txt --clobber

  release-notes:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unificar los checksums de todas las plataformas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p checksums
          gh release download "${{ github.ref_name }}" --dir checksums --pattern 'SHA256SUMS-*.txt'
          node scripts/checksums.mjs --combine checksums
          gh release upload "${{ github.ref_name }}" checksums/SHA256SUMS --clobber

      - name: Publicar nombre y notas en la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/release.mjs --apply-notes "${{ github.ref_name }}"